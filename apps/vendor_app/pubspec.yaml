name: vendor_app
description: "Kraveo Dhaba Owner Mobile App (High Volume Audio & Simple UI)"
publish_to: 'none'
version: 1.6.1+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  socket_io_client: ^2.0.3+1
  wakelock_plus: ^1.2.8
  kraveo_ui:
    path: ../../packages/kraveo_ui
  lucide_icons_flutter: ^3.1.20
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  package_info_plus: ^10.2.1
  # One-time GPS read when the restaurant taps "Detect my location" (foreground only, no background location).
  geolocator: ^11.0.0
  # "Open in Google Maps to check" link (external app / browser; the vendor app has no Maps key).
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Same alarm tone as android/app/src/main/res/raw/new_order_alarm.ogg (in-app alarm, no network needed).
    - assets/audio/new_order_alarm.ogg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: ../../Restaurant-Partner-Logo.png
