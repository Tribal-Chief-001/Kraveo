name: customer_app
description: "Kraveo Customer Food Ordering Mobile App for VIT Bhopal Students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  socket_io_client: ^2.0.3+1
  razorpay_flutter: ^1.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: ../../logo-customer-app.png
