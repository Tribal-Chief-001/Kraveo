name: driver_app
description: "Kraveo Delivery Partner Mobile App for Delivery Drivers"
publish_to: 'none'
version: 1.6.0+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  shared_preferences: ^2.2.2
  socket_io_client: ^2.0.3+1
  geolocator: ^11.0.0
  kraveo_ui:
    path: ../../packages/kraveo_ui
  lucide_icons_flutter: ^3.1.20
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  google_maps_flutter: ^2.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: ../../delivery-logo-bgremove.png
