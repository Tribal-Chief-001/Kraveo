name: kraveo_ui
description: Kraveo unified design system - tokens, themes and components shared by the customer, vendor and driver apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/brand/
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
