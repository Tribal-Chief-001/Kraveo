<body class="bg-inverse-surface h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative font-body-sm text-on-primary">

<!-- Dropoff Pin -->

<div class="relative w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center z-10 shadow-lg">

</div>
<!-- Route Line -->

<line stroke="#91d78a" stroke-dasharray="4,4" stroke-width="2" x1="30%" x2="70%" y1="30%" y2="60%"></line>

            New Request

<div class="w-6 h-6"></div> <!-- Spacer -->

<!-- Floating Job Card -->

<!-- Payout Header -->

<div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at center, #91d78a 0%, transparent 70%);"></div>

<!-- Job Details -->
<div class="p-md flex flex-col gap-sm">
<!-- Timeline/Locations -->

<!-- Vertical connecting line -->

<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<span class="font-title-md text-title-md font-bold text-primary-fixed-dim/80 mr-6">Slide to Accept</span>

</div>
<!-- Thumb -->
<div class="slide-thumb w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center cursor-grab active:cursor-grabbing z-10 shadow-[0_4px_12px_rgba(172,244,164,0.3)]" id="sliderThumb">
<span class="material-symbols-outlined text-on-primary-fixed font-bold text-[28px]">motorcycle</span>
</div>

</main>
<script>
        // Simple slider logic for visual interaction
        const thumb = document.getElementById('sliderThumb');
        const container = document.getElementById('sliderContainer');
        let isDragging = false;
        let startX;
        let thumbLeft = 0;

        thumb.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            thumb.style.transition = 'none';
        });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            const diff = currentX - startX;
            const maxDrag = container.offsetWidth - thumb.offsetWidth - 16; // padding

            let newLeft = Math.max(0, Math.min(diff, maxDrag));
            thumb.style.transform = `translateX(${newLeft}px)`;
            
            if (newLeft >= maxDrag * 0.9) {
                // Accepted
                thumb.innerHTML = '<span class="material-symbols-outlined text-on-primary-fixed font-bold">check</span>';
                thumb.classList.replace('bg-primary-fixed', 'bg-secondary-container');
            } else {
                 thumb.innerHTML = '<span class="material-symbols-outlined text-on-primary-fixed font-bold text-[28px]">motorcycle</span>';
                 thumb.classList.replace('bg-secondary-container', 'bg-primary-fixed');
            }
        });

        document.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            thumb.style.transition = 'transform 0.3s ease';
            
            const currentTransform = thumb.style.transform;
            const currentX = parseFloat(currentTransform.replace('translateX(', '').replace('px)', '')) || 0;
            const maxDrag = container.offsetWidth - thumb.offsetWidth - 16;

            if (currentX < maxDrag * 0.9) {
                // Snap back
                thumb.style.transform = 'translateX(0px)';
            } else {
                // Stay accepted (simulate success)
                thumb.style.transform = `translateX(${maxDrag}px)`;
                setTimeout(() => {
                    alert('Delivery Accepted!');
                    thumb.style.transform = 'translateX(0px)';
                    thumb.innerHTML = '<span class="material-symbols-outlined text-on-primary-fixed font-bold text-[28px]">motorcycle</span>';
                    thumb.classList.replace('bg-secondary-container', 'bg-primary-fixed');
                }, 500);
            }
        });
        
        // Mouse events for testing on desktop
        thumb.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            thumb.style.transition = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const currentX = e.clientX;
            const diff = currentX - startX;
            const maxDrag = container.offsetWidth - thumb.offsetWidth - 16;

            let newLeft = Math.max(0, Math.min(diff, maxDrag));
            thumb.style.transform = `translateX(${newLeft}px)`;
            
             if (newLeft >= maxDrag * 0.9) {
                thumb.innerHTML = '<span class="material-symbols-outlined text-on-primary-fixed font-bold">check</span>';
                thumb.classList.replace('bg-primary-fixed', 'bg-secondary-container');
            } else {
                 thumb.innerHTML = '<span class="material-symbols-outlined text-on-primary-fixed font-bold text-[28px]">motorcycle</span>';
                 thumb.classList.replace('bg-secondary-container', 'bg-primary-fixed');
            }
        });

        document.addEventListener('mouseup', () => {
             if (!isDragging) return;
            isDragging = false;
            thumb.style.transition = 'transform 0.3s ease';
            
            const currentTransform = thumb.style.transform;
            const currentX = parseFloat(currentTransform.replace('translateX(', '').replace('px)', '')) || 0;
            const maxDrag = container.offsetWidth - thumb.offsetWidth - 16;

            if (currentX < maxDrag * 0.9) {
                thumb.style.transform = 'translateX(0px)';
            } else {
                thumb.style.transform = `translateX(${maxDrag}px)`;
                 setTimeout(() => {
                    alert('Delivery Accepted!');
                    thumb.style.transform = 'translateX(0px)';
                    thumb.innerHTML = '<span class="material-symbols-outlined text-on-primary-fixed font-bold text-[28px]">motorcycle</span>';
                    thumb.classList.replace('bg-secondary-container', 'bg-primary-fixed');
                }, 500);
            }
        });
    </script>
