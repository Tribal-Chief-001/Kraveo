<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Incoming Order Alert</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "surface-bright": "#fcf9f8",
                        "on-secondary-fixed": "#221b00",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#6f5c00",
                        "on-secondary-fixed-variant": "#544600",
                        "primary-container": "#1b5e20",
                        "inverse-on-surface": "#f3f0ef",
                        "primary": "#00450d",
                        "on-background": "#1b1c1c",
                        "surface-dim": "#dcd9d9",
                        "surface": "#fcf9f8",
                        "on-tertiary-container": "#c4c5c5",
                        "secondary-fixed": "#ffe170",
                        "outline-variant": "#c0c9bb",
                        "surface-container-low": "#f6f3f2",
                        "error": "#ba1a1a",
                        "surface-container-high": "#eae7e7",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#e9c400",
                        "on-tertiary-fixed": "#1a1c1c",
                        "surface-tint": "#2a6b2c",
                        "secondary": "#705d00",
                        "primary-fixed-dim": "#91d78a",
                        "background": "#fcf9f8",
                        "surface-variant": "#e5e2e1",
                        "inverse-primary": "#91d78a",
                        "on-primary-fixed": "#002203",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#acf4a4",
                        "on-surface-variant": "#41493e",
                        "tertiary-fixed": "#e2e2e2",
                        "inverse-surface": "#303030",
                        "on-error": "#ffffff",
                        "secondary-container": "#fdd400",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-surface": "#1b1c1c",
                        "surface-container-highest": "#e5e2e1",
                        "surface-container": "#f0eded",
                        "on-primary-container": "#90d689",
                        "on-tertiary-fixed-variant": "#454747",
                        "outline": "#717a6d",
                        "tertiary": "#393b3b",
                        "on-primary-fixed-variant": "#0c5216",
                        "tertiary-container": "#505252"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "sm": "16px",
                        "base": "4px",
                        "gutter-mobile": "12px",
                        "xl": "48px",
                        "xs": "8px",
                        "margin-mobile": "16px",
                        "lg": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-bold": ["Plus Jakarta Sans"],
                        "title-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-bold": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        .pulse-bg {
            animation: pulse-bg 2s infinite;
        }
        @keyframes pulse-bg {
            0% { background-color: #fdd400; }
            50% { background-color: #ffe170; }
            100% { background-color: #fdd400; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen flex flex-col items-center justify-center font-sans antialiased overflow-hidden">
<!-- Incoming Order Alert Overlay -->
<div class="fixed inset-0 z-50 flex flex-col pulse-bg h-full w-full">
<!-- Header / Alert Banner -->
<div class="w-full bg-primary text-on-primary py-lg px-margin-mobile shadow-lg flex flex-col items-center justify-center">
<span class="material-symbols-outlined text-6xl mb-xs" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
<h1 class="font-display-lg text-display-lg text-center uppercase tracking-widest">New Order</h1>
<p class="font-title-md text-title-md opacity-90 mt-base">Order #8492</p>
<p class="font-body-lg text-body-lg mt-xs bg-on-primary text-primary px-sm py-base rounded-full font-bold">Pickup in 15 mins</p>
</div>
<!-- Order Details Content -->
<div class="flex-grow flex flex-col items-center justify-center p-margin-mobile w-full max-w-2xl mx-auto space-y-md">
<div class="bg-surface-container-lowest w-full rounded-2xl p-lg shadow-2xl border-4 border-primary">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm border-b-2 border-outline-variant pb-xs">Items to Prepare:</h2>
<ul class="space-y-sm">
<li class="flex items-start">
<span class="font-headline-lg text-headline-lg text-primary mr-sm">1x</span>
<span class="font-headline-lg text-headline-lg text-on-surface">Paneer Butter Masala</span>
</li>
<li class="flex items-start">
<span class="font-headline-lg text-headline-lg text-primary mr-sm">4x</span>
<span class="font-headline-lg text-headline-lg text-on-surface">Tandoori Roti</span>
</li>
<li class="flex items-start">
<span class="font-headline-lg text-headline-lg text-primary mr-sm">2x</span>
<span class="font-headline-lg text-headline-lg text-on-surface">Mango Lassi</span>
</li>
</ul>
<div class="mt-lg pt-sm border-t-2 border-outline-variant">
<p class="font-title-md text-title-md text-on-surface-variant">Customer Note:</p>
<p class="font-headline-lg-mobile text-headline-lg-mobile text-error font-bold bg-error-container p-sm rounded-lg mt-base">"Make it extra spicy please!"</p>
</div>
</div>
</div>
<!-- Action Buttons (Massive) -->
<div class="w-full flex p-margin-mobile gap-sm pb-xl">
<button class="flex-1 bg-error text-on-error py-md rounded-xl shadow-xl flex flex-col items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined text-4xl mb-base" style="font-variation-settings: 'FILL' 1;">close</span>
<span class="font-display-lg text-display-lg">DECLINE</span>
</button>
<button class="flex-1 bg-primary text-on-primary py-md rounded-xl shadow-xl flex flex-col items-center justify-center active:scale-95 transition-transform border-4 border-transparent hover:border-primary-fixed">
<span class="material-symbols-outlined text-4xl mb-base" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-display-lg text-display-lg">ACCEPT</span>
</button>
</div>
</div>
</body></html>
