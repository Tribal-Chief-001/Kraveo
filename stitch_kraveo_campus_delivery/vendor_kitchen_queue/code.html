</div>
<div class="text-center flex-grow">
<h1 class="text-on-primary font-black uppercase tracking-wider font-headline-lg text-headline-lg">Orders Management</h1>
</div>
<div class="flex items-center gap-xs text-on-primary opacity-80">
<span class="material-symbols-outlined text-title-md font-title-md" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
</div>
</div>

<div class="w-full max-w-7xl mx-auto mt-sm flex justify-center">

</label>
</div>
</header>
<main class="w-full max-w-7xl mx-auto px-margin-mobile md:px-md py-md flex flex-col gap-sm">
<!-- Order Card 1 -->
<div class="bg-surface rounded-lg border border-outline-variant p-sm flex flex-col gap-sm shadow-sm relative overflow-hidden">
<!-- Status indicator line -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary-container"></div>
<div class="flex justify-between items-start pl-base">
<div>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">#A01</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">Arun K. • Table 4</p>
</div>
<div class="bg-surface-variant text-on-surface-variant px-2 py-1 rounded font-label-bold text-label-bold flex items-center gap-1">

                     06:45
                 </div>
</div>
<div class="pl-base border-t border-outline-variant pt-sm">

<li class="flex justify-between"><span>4x Butter Naan</span></li>
<li class="flex justify-between"><span>1x Lassi</span></li>
</ul>
</div>
<button class="w-full bg-primary text-on-primary font-title-md text-title-md py-3 rounded-lg mt-xs hover:bg-primary-container transition-colors shadow-sm">
                 MARK READY FOR PICKUP
             </button>
</div>
<!-- Order Card 2 -->
<div class="bg-surface rounded-lg border border-outline-variant p-sm flex flex-col gap-sm shadow-sm relative overflow-hidden">

<div>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">#A02</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">Priya M. • Takeaway</p>
</div>
<div class="bg-error-container text-on-error-container px-2 py-1 rounded font-label-bold text-label-bold flex items-center gap-1">
<span class="material-symbols-outlined text-sm">schedule</span>

                 </div>
</div>
<div class="pl-base border-t border-outline-variant pt-sm">
