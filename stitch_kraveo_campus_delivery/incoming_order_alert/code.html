<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vendor App - Incoming Order</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#002203",
                        "surface-container": "#f0eded",
                        "on-secondary-fixed-variant": "#544600",
                        "outline": "#717a6d",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#acf4a4",
                        "on-surface": "#1b1c1c",
                        "primary-fixed-dim": "#91d78a",
                        "on-primary-fixed-variant": "#0c5216",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#ffe170",
                        "primary-container": "#1b5e20",
                        "secondary-fixed-dim": "#e9c400",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "surface-bright": "#fcf9f8",
                        "inverse-primary": "#91d78a",
                        "secondary": "#705d00",
                        "tertiary-fixed": "#e2e2e2",
                        "inverse-surface": "#303030",
                        "secondary-container": "#fdd400",
                        "surface-container-highest": "#e5e2e1",
                        "on-tertiary-fixed-variant": "#454747",
                        "primary": "#00450d",
                        "on-secondary-container": "#6f5c00",
                        "on-secondary-fixed": "#221b00",
                        "on-background": "#1b1c1c",
                        "inverse-on-surface": "#f3f0ef",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f6f3f2",
                        "on-surface-variant": "#41493e",
                        "surface-tint": "#2a6b2c",
                        "on-tertiary-fixed": "#1a1c1c",
                        "surface-variant": "#e5e2e1",
                        "on-tertiary-container": "#c4c5c5",
                        "on-primary-container": "#90d689",
                        "error": "#ba1a1a",
                        "background": "#fcf9f8",
                        "tertiary": "#393b3b",
                        "tertiary-container": "#505252",
                        "surface-container-high": "#eae7e7",
                        "outline-variant": "#c0c9bb",
                        "surface": "#fcf9f8",
                        "tertiary-fixed-dim": "#c6c6c7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-mobile": "12px",
                        "md": "24px",
                        "xl": "48px",
                        "lg": "32px",
                        "margin-mobile": "16px",
                        "sm": "16px",
                        "xs": "8px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "body-sm": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-bold": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "title-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-bold": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .animate-pulse-slow {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(253, 212, 0, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(253, 212, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(253, 212, 0, 0); }
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-full flex items-center justify-center overflow-hidden">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-surface/80 backdrop-blur-sm z-40 flex flex-col justify-end md:justify-center p-0 md:p-md">
<!-- Modal Content Container -->
<div class="bg-surface w-full md:max-w-[600px] md:mx-auto md:rounded-xl rounded-t-xl z-50 flex flex-col shadow-2xl overflow-hidden animate-pulse-slow border-t-8 border-secondary-container">
<!-- Header Section -->
<div class="bg-primary text-on-primary p-md flex items-center justify-center">
<span class="material-symbols-outlined text-display-lg mr-sm" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
<h1 class="font-display-lg text-display-lg uppercase tracking-tight">NEW ORDER</h1>
</div>
<!-- Content Section -->
<div class="p-md md:p-lg flex flex-col items-center justify-center bg-surface-container-lowest flex-grow">
<div class="bg-secondary-container text-on-secondary-container rounded-full px-lg py-sm mb-lg font-headline-lg-mobile text-headline-lg-mobile w-auto inline-block mx-auto text-center">
                    #104
                </div>
<div class="w-full space-y-md border-y-2 border-surface-container-high py-md">
<!-- Item 1 -->
<div class="flex justify-between items-center bg-surface-container-low p-sm rounded-lg">
<div class="flex items-center">
<span class="font-display-lg text-display-lg text-primary mr-sm">1x</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Paneer Butter Masala</span>
</div>
</div>
<!-- Item 2 -->
<div class="flex justify-between items-center bg-surface-container-low p-sm rounded-lg">
<div class="flex items-center">
<span class="font-display-lg text-display-lg text-primary mr-sm">4x</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Butter Roti</span>
</div>
</div>
</div>
<!-- Total -->
<div class="w-full mt-lg flex justify-between items-end">
<span class="font-title-md text-title-md text-on-surface-variant uppercase">Total Amount</span>
<span class="font-display-lg text-display-lg text-on-surface">₹220</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col md:flex-row w-full p-sm gap-sm bg-surface-container-lowest">
<button class="w-full md:w-1/2 bg-error text-on-error py-md rounded-lg font-headline-lg-mobile text-headline-lg-mobile uppercase active:scale-95 transition-transform flex items-center justify-center gap-xs">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">close</span>
                    REJECT
                </button>
<button class="w-full md:w-1/2 bg-primary text-on-primary py-md rounded-lg font-headline-lg-mobile text-headline-lg-mobile uppercase active:scale-95 transition-transform flex items-center justify-center gap-xs shadow-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check</span>
                    ACCEPT
                </button>
</div>
</div>
</div>
</body></html>
